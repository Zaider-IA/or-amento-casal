<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Orçamento Casal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ===== CORES DO KINVO (medidas nas prints) ===== */
:root{--cyan:#0BCDE6;--cyan2:#08B8E1;--purple:#622DBB;--purple2:#9C4BD6;--lav:#B5A6F7;--orange:#FEA24F;
--bg:#FFFFFF;--bg2:#F3F4F6;--auth:#FAFCFB;--card:#FFFFFF;--text:#090909;--head:#4D5A60;--muted:#7B848A;--line:#E3E7EB;--nav:#F5F6FA;
--pos:#12A150;--neg:#D93A41;--radius:20px}
:root[data-theme=dark]{--bg:#101218;--bg2:#171A22;--auth:#101218;--card:#1B1F2A;--text:#F2F3F7;--head:#D6DBE0;--muted:#98A0AB;--line:#2A2F3C;--nav:#151821;--lav:#3B2F73;--pos:#3DD68C;--neg:#FF7B80;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.4}
#app{max-width:480px;min-height:100%;margin:0 auto;position:relative}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--cyan2);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{width:64px;height:64px;display:block}
.screen{padding:calc(36px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--auth)}
.screen::before{content:"";position:absolute;right:-70%;top:6%;width:140%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,transparent 30%,rgba(120,130,140,.1));pointer-events:none}
.screen>*{position:relative}
.screen form{display:flex;flex-direction:column}
.grow{flex:1}
.eyebrow{color:var(--cyan);font-size:19px;font-weight:500;margin-top:34px}
.h1,.screen h1{font-size:31px;line-height:1.22;font-weight:700;color:var(--head);letter-spacing:-.5px;margin:12px 0 24px}
.screen p.sub{color:var(--muted);margin:-12px 0 20px}
.fld{display:flex;align-items:center;gap:12px;height:64px;padding:0 22px;border:1px solid var(--line);border-radius:999px;background:var(--card);margin:12px 0 0;font-weight:500;color:var(--head)}
.fld:focus-within{border-color:var(--cyan)}
.fld input{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:17px;font-weight:400;outline:none}
.eye{color:var(--head);display:grid;place-items:center}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px 8px}
.in{width:100%;height:56px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.acts{display:flex;gap:14px;margin-top:auto;padding-top:28px}
.pb{flex:1;display:flex;align-items:center;gap:6px;height:64px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:17px;font-weight:500;color:var(--head)}
.pb .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.pb .ci svg{width:22px;height:22px;stroke-width:2.2}
.pb .pl{flex:1;text-align:center}
.pb:disabled{opacity:.6}
.ci.cy{background:var(--cyan)}.ci.pu{background:var(--purple2)}.ci.gr{background:#B7BDC4}
.btn{width:100%;padding:16px;border-radius:999px;background:var(--purple);color:#fff;font-weight:600;margin-top:18px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.outline{background:transparent;color:var(--purple);border:1.5px solid var(--purple)}
.btn.del{background:transparent;color:var(--neg);border:1.5px solid var(--neg);margin-top:12px}
.link{display:block;margin:20px auto 0;color:var(--head);font-weight:500}
.msg{margin-top:14px;padding:12px 16px;border-radius:16px;font-size:14px;background:rgba(217,58,65,.12);color:var(--neg)}
.msg.ok{background:rgba(18,161,80,.12);color:var(--pos)}
.choice{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.choice button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:16px 22px;border:1px solid var(--line);border-radius:28px;background:var(--card)}
.choice button::after{content:"";width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.choice button.on{background:var(--bg2)}
.choice button.on::after{background:var(--cyan);border-color:var(--cyan);box-shadow:inset 0 0 0 5px var(--bg2)}
.choice b{display:block;font-size:17px;font-weight:600}
.choice span{font-size:13px;color:var(--muted)}
.sep{margin:30px 0 4px;padding-top:22px;border-top:1px solid var(--line);font-weight:600;color:var(--head)}
.top{padding:calc(14px + env(safe-area-inset-top)) 20px 0;background:var(--bg)}
.top.gray{background:var(--bg2);padding-bottom:22px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hello{font-size:20px;font-weight:500;line-height:1.25}
.hello.big{font-size:26px;font-weight:600}
.ico{display:flex;gap:2px;margin-right:-8px}
.ico button{width:44px;height:44px;display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.tabs{display:flex;margin-top:12px;border-bottom:3px solid var(--line)}
.tabs button{flex:1;padding:14px 4px;font-size:17px;color:var(--muted);margin-bottom:-3px;border-bottom:3px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--purple)}
.month{display:flex;align-items:center;justify-content:space-between;padding:10px 0 0}
.month span{font-weight:600;font-size:17px}
.month button{width:40px;height:40px;border-radius:50%;background:var(--bg2);font-size:22px}
.prof{display:flex;align-items:center;gap:16px;margin:18px 0 18px}
.av{width:64px;height:64px;border-radius:50%;background:#D9DCE1;display:grid;place-items:center;font-weight:600;color:var(--head);font-size:22px;flex:none}
.pn{font-size:20px}
.pv{font-size:17px;margin-top:2px}
main{padding:18px 20px calc(120px + env(safe-area-inset-bottom))}
.hero{background:var(--lav);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.hero .k{color:var(--text);opacity:.7}
.hero h2{font-size:18px;font-weight:600;margin-bottom:6px}
.bal{font-size:34px;font-weight:700;letter-spacing:-.8px;margin-top:2px}
.bal.neg{color:var(--neg)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{font-size:16px;font-weight:600;margin-bottom:14px}
.two{display:flex;gap:12px;margin-bottom:14px}
.two .card{flex:1;margin:0}
.k{font-size:13px;color:var(--muted)}
.v{font-size:19px;font-weight:700;margin-top:2px}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.bar i.over{background:var(--neg)} .bar i.acc{background:var(--purple)}
.row{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.row small{color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.rows{margin-top:8px}
.rowl{display:flex;justify-content:space-between;align-items:center;width:100%;padding:24px 4px;border-bottom:1px solid var(--line);font-size:18px;text-align:left}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:var(--nav);border-top:1px solid var(--line);padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:2px 0}
nav button.on{color:var(--text);font-weight:500}
nav svg.i{width:28px;height:28px}
#toast{z-index:30;position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;font-weight:600;color:var(--head);text-align:center;margin:6px 0 4px}
.sheet .x{float:right;font-size:28px;line-height:1;color:var(--muted);padding:0 4px}
.seg{display:flex;background:var(--bg2);border-radius:999px;padding:4px;margin:14px 0 4px}
.seg button{flex:1;padding:12px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--purple);color:#fff}
.seg.kind button.on.des{background:var(--neg)} .seg.kind button.on.rec{background:var(--pos)}
.in.big{height:64px;font-size:28px;font-weight:700;text-align:center}
.day{font-size:13px;color:var(--muted);margin:16px 4px 8px}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;width:100%;text-align:left}
.item .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando…</div></div>
<div id="toast" role="status"></div>

<script>
// ===== CONEXÃO COM O SUPABASE =====
const SUPABASE_URL = 'https://rqrbvuivipjestrnywdi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_u02jjsiUoA8Vz1FRJHQwog_J9iDBTM1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => S.hide ? 'R$ ••••' : new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}).format(n || 0);
const ptErr = m => ({
  'Invalid login credentials':'E-mail ou senha incorretos.',
  'User already registered':'Este e-mail já tem conta. Toque em Entrar.',
  'Password should be at least 6 characters':'A senha precisa ter pelo menos 6 caracteres.'
}[m] || m);

const ICONS = {
  resumo:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M6 6V5a2 2 0 012-2h9"/>',
  lanc:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  metas:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  rel:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1.1"/>',
  moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .3c0 1.7-2.5 2-2.5 3.7M12 17h.01"/>',
  plusc:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  chev:'<path d="M9 6l6 6-6 6"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const LOGO = '<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-width="6"><path d="M32 4A28 28 0 1 1 4 32" stroke="#0BCDE6"/><path d="M32 13A19 19 0 1 1 13 32" stroke="#8650DA"/><path d="M32 22A10 10 0 1 1 22 32" stroke="#FEA24F"/></g></svg>';
const pill = (ci, ic, label, attrs) => `<button class="pb" ${attrs}><span class="ci ${ci}">${icon(ic)}</span><span class="pl">${label}</span></button>`;
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const load = k => { try { return localStorage.getItem(k); } catch { return null; } };
function setTheme(d){ S.dark = d; document.documentElement.dataset.theme = d ? 'dark' : 'light'; store('tema', d ? 'dark' : 'light'); }

const first = d => new Date(d.getFullYear(), d.getMonth(), 1);
const S = { session:null, me:null, partner:null, house:null, settings:null,
            month:first(new Date()), tab:'resumo', view:'casal', tx:[], mode:'casal', authTab:'in', cats:[], subs:[], pms:[], sheet:null, _r:.5,
            hide:load('hide') === '1', dark:load('tema') === 'dark' };
setTheme(S.dark);

function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
function monthLabel(){ const t=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(S.month); return t.charAt(0).toUpperCase()+t.slice(1); }
function monthKey(){ const d=S.month; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }
function setMsg(t, ok){ const e=$('#msg'); if(e){ e.className='msg'+(ok?' ok':''); e.textContent=t; } }

// ===== ENTRADA (login / criar conta) =====
sb.auth.onAuthStateChange((ev, session) => {
  const changed = (session?.user?.id) !== (S.session?.user?.id);
  S.session = session;
  if (ev === 'PASSWORD_RECOVERY') return setTimeout(renderRecovery, 0);
  if (ev === 'INITIAL_SESSION' || changed) setTimeout(route, 0);
});

const params = new URLSearchParams(location.search);
if (params.get('convite')) sessionStorage.setItem('convite', params.get('convite'));

async function route(){
  if (!S.session) return renderAuth();
  const { data, error } = await sb.from('members')
    .select('id,display_name,role,household_id,households(id,name,mode)')
    .eq('user_id', S.session.user.id).limit(1);
  if (error) return renderFail(error.message);
  if (!data.length) return renderOnboarding();
  const m = data[0];
  S.me = { id:m.id, name:m.display_name, role:m.role };
  S.house = m.households;
  const { data:all } = await sb.from('members').select('id,display_name').eq('household_id', S.house.id);
  S.partner = (all || []).find(x => x.id !== S.me.id) || null;
  const { data:st } = await sb.from('settings').select('*').eq('household_id', S.house.id).maybeSingle();
  S.settings = st || { pct_essenciais:55, pct_boleto:30, pct_livre:10, pct_educacao:5 };
  S.view = 'casal';
  const [c, sc, pm] = await Promise.all([
    sb.from('categories').select('id,name,kind,group_key,sort_order,hidden').order('sort_order'),
    sb.from('subcategories').select('id,category_id,name,sort_order,hidden').order('sort_order'),
    sb.from('payment_methods').select('id,name,applies_to,sort_order').order('sort_order')
  ]);
  S.cats = c.data || []; S.subs = sc.data || []; S.pms = pm.data || [];
  await loadMonth();
  renderShell();
}

function renderFail(t){
  $('#app').innerHTML = `<div class="screen"><h1>Algo deu errado</h1><p class="sub">${esc(t)}</p>
  <button class="btn" data-act="retry">Tentar de novo</button><button class="btn ghost" data-act="logout">Sair</button></div>`;
}

function renderAuth(){
  $('#app').innerHTML = `<div class="screen">${LOGO}
    <div class="eyebrow">Entre no Orçamento Casal ou crie uma conta</div>
    <h1 class="h1">Informe seu e-mail de cadastro e senha.</h1>
    <form data-form="auth" class="grow">
      <label class="fld"><span>E-mail:</span><input id="email" type="email" autocomplete="email" required></label>
      <label class="fld"><span>Senha:</span><input id="pw" type="password" autocomplete="current-password" minlength="6" required>
        <button type="button" class="eye" data-act="pw" aria-label="Mostrar senha">${icon('eyeoff')}</button></label>
      <div id="msg"></div>
      <div class="acts">${pill('pu', 'user', 'Criar conta', 'type="button" data-act="signup"')}${pill('cy', 'arrow', 'Entrar', 'type="submit"')}</div>
    </form>
    <button class="link" data-act="forgot">Esqueceu a senha?</button></div>`;
}

function renderRecovery(){
  $('#app').innerHTML = `<div class="screen"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-width="6"><path d="M32 4A28 28 0 1 1 4 32" stroke="#0BCDE6"/><path d="M32 13A19 19 0 1 1 13 32" stroke="#8650DA"/><path d="M32 22A10 10 0 1 1 22 32" stroke="#FEA24F"/></g></svg><h1>Nova senha</h1><p class="sub">Escolha uma senha nova para a sua conta.</p>
  <form data-form="recovery"><label for="pw">Nova senha</label><input class="in" id="pw" type="password" minlength="6" required>
  <button class="btn" type="submit">Salvar senha</button></form><div id="msg"></div></div>`;
}

// ===== BOAS-VINDAS: criar casa ou entrar por convite =====
function renderOnboarding(){
  const tk = sessionStorage.getItem('convite') || '';
  $('#app').innerHTML = `<div class="screen">${LOGO}
    <h1 class="h1" style="margin-top:28px">Como você quer usar o app?</h1>
    <form data-form="house">
      <div class="choice">
        <button type="button" data-act="mode" data-v="casal" class="${S.mode === 'casal' ? 'on' : ''}"><div><b>Casal</b><span>Dois perfis, um orçamento</span></div></button>
        <button type="button" data-act="mode" data-v="individual" class="${S.mode === 'individual' ? 'on' : ''}"><div><b>Individual</b><span>Só eu</span></div></button>
      </div>
      <label class="fld"><span>Seu nome:</span><input id="dn" required maxlength="40"></label>
      <label class="fld"><span>Casa:</span><input id="hn" value="Nossa casa" maxlength="40"></label>
      <div class="acts">${pill('cy', 'check', 'Começar', 'type="submit"')}</div>
    </form>
    <div class="sep">Recebeu um convite?</div>
    <form data-form="invite">
      <label class="fld"><span>Código:</span><input id="tk" value="${esc(tk)}"></label>
      <label class="fld"><span>Seu nome:</span><input id="dn2" maxlength="40" required></label>
      <div class="acts">${pill('pu', 'arrow', 'Entrar na casa', 'type="submit"')}</div>
    </form>
    <button class="link" data-act="logout">Sair da conta</button><div id="msg"></div></div>`;
}

// ===== DADOS DO MÊS =====
async function loadMonth(){
  const { data, error } = await sb.from('transactions')
    .select('id,amount,date,member_id,split_mode,payment_method_id,notes,installment_number,installments_total,subcategory_id,subcategories(name,categories(name,kind,group_key))')
    .eq('ref_month', monthKey())
    .order('date', { ascending:false }).order('created_at', { ascending:false });
  S.tx = error ? [] : data;
  if (error) toast('Não consegui carregar os lançamentos.');
}

// Despesa dos "dois" (sem pessoa) conta metade para cada um nas visões individuais.
function ratioMe(){
  let me = 0, all = 0;
  for (const t of S.tx){
    if (t.subcategories?.categories?.kind !== 'receita') continue;
    all += +t.amount; if (t.member_id === S.me.id) me += +t.amount;
  }
  return all > 0 ? me / all : .5;
}
function share(t){
  const v = +t.amount;
  if (S.view === 'casal') return v;
  const mine = S.view === 'eu', id = mine ? S.me.id : S.partner?.id;
  if (t.member_id === id) return v;
  if (t.member_id !== null) return 0;
  const r = t.split_mode === 'proporcional' ? S._r : .5;
  return v * (mine ? r : 1 - r);
}
function totals(){
  S._r = ratioMe();
  const r = { renda:0, desp:0, g:{ essencial:0, boleto_pessoal:0, livre:0, educacao:0 } };
  for (const t of S.tx){
    const c = t.subcategories?.categories; if (!c) continue;
    const v = share(t);
    if (c.kind === 'receita') r.renda += v; else { r.desp += v; r.g[c.group_key] += v; }
  }
  r.saldo = r.renda - r.desp;
  return r;
}

// ===== TELA PRINCIPAL =====
const TABS = [['resumo','Resumo','resumo'],['lanc','Lançamentos','lanc'],['metas','Metas','metas'],['rel','Relatórios','rel'],['mais','Conta','user']];

function renderShell(){
  const t = totals(), casal = S.house.mode === 'casal' && S.partner;
  const modo = S.house.mode === 'casal' ? 'Casal' : 'Individual';
  const head = S.tab === 'mais'
    ? `<header class="top gray"><div class="hello big">Conta</div>
        <div class="prof"><div class="av">${esc(S.me.name.charAt(0).toUpperCase())}</div><div class="pn">${esc(S.me.name)}</div></div>
        <div class="k">Casa</div><div class="pv">${esc(S.house.name)} · ${modo}${S.partner ? ' (' + esc(S.me.name) + ' e ' + esc(S.partner.display_name) + ')' : ''}</div></header>`
    : `<header class="top"><div class="hrow"><div class="hello">Olá,<br>${esc(S.me.name)}</div>
        <div class="ico">
          <button data-act="hide" aria-label="Ocultar valores">${icon(S.hide ? 'eyeoff' : 'eye')}</button>
          <button data-act="theme" aria-label="Tema escuro">${icon('moon')}</button>
          <button data-act="help" aria-label="Ajuda">${icon('help')}</button>
          <button data-act="fab" aria-label="Novo lançamento">${icon('plusc')}</button>
        </div></div>
        ${casal ? `<div class="tabs">${[['eu', 'Eu'], ['par', esc(S.partner.display_name)], ['casal', 'Casal']].map(([k, n]) => `<button data-act="view" data-v="${k}" class="${S.view === k ? 'on' : ''}">${n}</button>`).join('')}</div>` : ''}
        <div class="month"><button data-act="prev" aria-label="Mês anterior">‹</button><span>${monthLabel()}</span><button data-act="next" aria-label="Próximo mês">›</button></div></header>`;
  $('#app').innerHTML = `${head}<main>${tabHtml(t)}</main>
    <nav>${TABS.map(([k, n, i]) => `<button data-act="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}">${icon(i)}${n}</button>`).join('')}</nav>`;
}

function tabHtml(t){
  if (S.tab === 'resumo') return resumoHtml(t);
  if (S.tab === 'mais') return maisHtml();
  if (S.tab === 'lanc') return lancHtml();
  const soon = {
                 metas:['Metas','Acompanhe Metinha, Meta, Metona e as outras.','etapa 5'],
                 rel:['Relatórios','Gráficos por categoria, mês e trimestre.','etapa 4'] }[S.tab];
  return `<div class="card empty"><b>${soon[0]}</b>${soon[1]}<br>Chega na ${soon[2]}.</div>`;
}

function resumoHtml(t){
  const s = S.settings;
  const rows = [['Essenciais','essencial',s.pct_essenciais],['Boleto Pessoal (metas)','boleto_pessoal',s.pct_boleto],
                ['Gastos livres','livre',s.pct_livre],['Educação','educacao',s.pct_educacao]];
  return `<div class="hero"><div class="k">Saldo do mês</div><div class="bal ${t.saldo < 0 ? 'neg' : ''}">${brl(t.saldo)}</div></div>
  <div class="two">
    <div class="card"><div class="k">Receitas</div><div class="v pos">${brl(t.renda)}</div></div>
    <div class="card"><div class="k">Despesas</div><div class="v neg">${brl(t.desp)}</div></div></div>
  <div class="card"><h2>Regra ${rows.map(r => +r[2]).join(' / ')}</h2>
    ${rows.map(([n, k, p]) => {
      const alvo = t.renda * p / 100, gasto = t.g[k];
      const pct = alvo > 0 ? Math.min(100, gasto / alvo * 100) : 0;
      const cls = k === 'boleto_pessoal' ? 'acc' : (gasto > alvo && alvo > 0 ? 'over' : '');
      return `<div class="row"><span>${n}</span><small>${brl(gasto)} de ${brl(alvo)}</small></div>
              <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>`;
    }).join('')}</div>
  ${S.tx.length ? '' : `<div class="card empty"><b>Nenhum lançamento neste mês</b>Toque no ⊕ no topo para adicionar o primeiro.</div>`}`;
}

function maisHtml(){
  const canInvite = S.house.mode === 'casal' && !S.partner;
  const row = (act, label) => `<button class="rowl" data-act="${act}">${label}${icon('chev')}</button>`;
  return `${canInvite ? `<div class="hero"><h2>Convide seu parceiro(a)</h2>
    <p class="k">Gere um link e mande pelo WhatsApp. Quem abrir cria a conta e entra na sua casa.</p>
    <button class="btn outline" data-act="invite">Gerar link do convite</button><div id="invite-out"></div></div>` : ''}
  <div class="rows">${row('theme', S.dark ? 'Tema claro' : 'Tema escuro')}${row('hide', S.hide ? 'Mostrar valores' : 'Ocultar valores')}${row('logout', 'Sair da conta')}</div>`;
}

// ===== LANÇAMENTOS: lista, novo, editar, apagar =====
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function addMonths(s, i){
  const [y, m, d] = s.split('-').map(Number), t = new Date(y, m - 1 + i, 1);
  t.setDate(Math.min(d, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
  return ymd(t);
}
function parseMoney(s){
  s = String(s).trim().replace(/[^\d,.-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return Math.round(parseFloat(s) * 100) / 100;
}
function fmtDay(s){
  const [y, m, d] = s.split('-').map(Number);
  return new Intl.DateTimeFormat('pt-BR', { weekday:'short', day:'2-digit', month:'short' }).format(new Date(y, m - 1, d));
}

function lancHtml(){
  const list = S.tx.filter(t => S.view === 'casal' || share(t) > 0);
  if (!list.length) return `<div class="card empty"><b>Nenhum lançamento neste mês</b>Toque no + para adicionar.</div>`;
  let h = '', day = '';
  for (const t of list){
    if (t.date !== day){ day = t.date; h += `<div class="day">${fmtDay(day)}</div>`; }
    const c = t.subcategories?.categories, rec = c?.kind === 'receita', cor = rec ? 'var(--pos)' : 'var(--neg)';
    const who = t.member_id === S.me.id ? S.me.name : (t.member_id === S.partner?.id ? S.partner.display_name : 'Os dois');
    const parc = t.installments_total > 1 ? ` (${t.installment_number}/${t.installments_total})` : '';
    h += `<button class="item" data-act="edit" data-v="${t.id}">
      <div class="dot" style="background:${cor}">${esc((t.subcategories?.name || '?').charAt(0).toUpperCase())}</div>
      <div class="t"><b>${esc(t.subcategories?.name)}${parc}</b><span class="k">${esc(c?.name)} · ${esc(who)}</span></div>
      <div class="a" style="color:${cor}">${rec ? '+' : '−'}${brl(t.amount)}</div></button>`;
  }
  return h;
}

const opts = (list, sel) => list.map(([v, n]) => `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(n)}</option>`).join('');
const catOpts = (kind, sel) => opts(S.cats.filter(c => c.kind === kind && !c.hidden).map(c => [c.id, c.name]), sel);
const subOpts = (cat, sel) => opts(S.subs.filter(x => x.category_id === cat && !x.hidden).map(x => [x.id, x.name]), sel);
function pmOpts(kind, catId, sel){
  const tag = kind === 'receita' ? 'receita' : (S.cats.find(c => c.id === catId)?.group_key === 'boleto_pessoal' ? 'meta' : 'despesa');
  return opts([['', 'Não informar']].concat(S.pms.filter(p => p.applies_to.includes(tag)).map(p => [p.id, p.name])), sel || '');
}
function firstOf(kind){
  const cat = S.cats.find(c => c.kind === kind && !c.hidden)?.id;
  return { cat, sub: S.subs.find(x => x.category_id === cat && !x.hidden)?.id };
}

function openSheet(id){
  const t = id && S.tx.find(x => x.id === id);
  if (t){
    const sub = S.subs.find(x => x.id === t.subcategory_id);
    S.sheet = { id:t.id, kind:t.subcategories?.categories?.kind || 'despesa', amt:String(t.amount).replace('.', ','),
      cat:sub?.category_id, sub:t.subcategory_id, who:t.member_id === S.me.id ? 'me' : (t.member_id === S.partner?.id ? 'par' : 'both'),
      split:t.split_mode === 'proporcional' ? 'proporcional' : '50_50', pm:t.payment_method_id || '', dt:t.date, nt:t.notes || '', inst:1 };
  } else {
    const now = new Date(), cur = now.getFullYear() === S.month.getFullYear() && now.getMonth() === S.month.getMonth();
    S.sheet = { id:null, kind:'despesa', amt:'', ...firstOf('despesa'), who:'me', split:'50_50', pm:'', dt:cur ? ymd(now) : monthKey(), nt:'', inst:1 };
  }
  renderSheet();
}
function closeSheet(){ S.sheet = null; $('#sheet')?.remove(); }

function renderSheet(){
  const f = S.sheet; let el = $('#sheet');
  if (!el){ el = document.createElement('div'); el.id = 'sheet'; document.body.appendChild(el); }
  const casal = S.house.mode === 'casal' && S.partner;
  const who = [['me', 'Eu']].concat(casal ? [['par', S.partner.display_name], ['both', 'Os dois']] : []);
  el.innerHTML = `<div class="sheet-bg" data-act="sclose"><div class="sheet" role="dialog" aria-modal="true">
    <button class="x" data-act="sclose" aria-label="Fechar">×</button>
    <h2>${f.id ? 'Editar lançamento' : 'Novo lançamento'}</h2>
    <div class="seg kind">
      <button type="button" data-act="skind" data-v="despesa" class="${f.kind === 'despesa' ? 'on des' : ''}">Despesa</button>
      <button type="button" data-act="skind" data-v="receita" class="${f.kind === 'receita' ? 'on rec' : ''}">Receita</button>
    </div>
    <form data-form="tx">
      <label for="amt">Valor (R$)</label><input class="in big" id="amt" inputmode="decimal" placeholder="0,00" value="${esc(f.amt)}" required>
      <label for="cat">Categoria</label><select class="in" id="cat">${catOpts(f.kind, f.cat)}</select>
      <label for="sub">Item</label><select class="in" id="sub">${subOpts(f.cat, f.sub)}</select>
      <label for="who">Quem</label><select class="in" id="who">${opts(who, f.who)}</select>
      <div id="splitbox"${f.who === 'both' ? '' : ' hidden'}><label for="split">Divisão entre os dois</label>
        <select class="in" id="split">${opts([['50_50', '50% para cada'], ['proporcional', 'Proporcional à renda de cada um']], f.split)}</select></div>
      <label for="pm">Meio de ${f.kind === 'receita' ? 'recebimento' : 'pagamento'}</label><select class="in" id="pm">${pmOpts(f.kind, f.cat, f.pm)}</select>
      <label for="dt">Data</label><input class="in" id="dt" type="date" value="${f.dt}" required>
      ${f.kind === 'despesa' && !f.id ? `<label for="inst">Parcelas (1 = à vista)</label><input class="in" id="inst" type="number" min="1" max="60" value="${f.inst}">` : ''}
      <label for="nt">Observação</label><input class="in" id="nt" maxlength="120" value="${esc(f.nt)}">
      <div class="acts">${pill('gr', 'x', 'Cancelar', 'type="button" data-act="sclose" data-v="close"')}${pill('cy', 'check', 'Salvar', 'type="submit"')}</div>
      ${f.id ? '<button type="button" class="btn del" data-act="sdel">Apagar lançamento</button>' : ''}
    </form><div id="msg"></div></div></div>`;
}

function readForm(){
  const f = S.sheet, g = i => document.getElementById(i);
  f.amt = g('amt').value; f.cat = g('cat').value; f.sub = g('sub').value; f.who = g('who').value;
  f.split = g('split').value; f.pm = g('pm').value; f.dt = g('dt').value; f.nt = g('nt').value;
  if (g('inst')) f.inst = +g('inst').value || 1;
}
function switchKind(kind){ Object.assign(S.sheet, { kind, pm:'' }, firstOf(kind)); renderSheet(); }

async function saveTx(){
  readForm(); const x = S.sheet, amount = parseMoney(x.amt);
  if (!(amount > 0)) return setMsg('Digite um valor maior que zero.');
  if (!x.sub) return setMsg('Escolha o item.');
  const base = { subcategory_id:x.sub, member_id:x.who === 'me' ? S.me.id : (x.who === 'par' ? S.partner.id : null),
    split_mode:x.who === 'both' ? x.split : 'nenhum', payment_method_id:x.pm || null, notes:x.nt || null };
  let error;
  if (x.id){
    ({ error } = await sb.from('transactions').update({ ...base, amount, date:x.dt }).eq('id', x.id));
  } else {
    const n = Math.max(1, Math.min(60, x.inst || 1)), each = Math.floor(amount / n * 100) / 100, grp = n > 1 ? crypto.randomUUID() : null, rows = [];
    for (let i = 0; i < n; i++){
      rows.push({ ...base, household_id:S.house.id, amount:i === n - 1 ? +(amount - each * (n - 1)).toFixed(2) : each,
        date:addMonths(x.dt, i), installment_group:grp, installment_number:n > 1 ? i + 1 : null, installments_total:n > 1 ? n : null });
    }
    ({ error } = await sb.from('transactions').insert(rows));
  }
  if (error) return setMsg(error.message);
  closeSheet(); await loadMonth(); renderShell(); toast('Lançamento salvo!');
}
async function delTx(){
  if (!confirm('Apagar este lançamento?')) return;
  const { error } = await sb.from('transactions').delete().eq('id', S.sheet.id);
  if (error) return setMsg(error.message);
  closeSheet(); await loadMonth(); renderShell(); toast('Lançamento apagado.');
}
document.addEventListener('change', e => {
  if (!S.sheet) return;
  if (e.target.id === 'cat'){
    $('#sub').innerHTML = subOpts(e.target.value, '');
    $('#pm').innerHTML = pmOpts(S.sheet.kind, e.target.value, $('#pm').value);
  }
  if (e.target.id === 'who') $('#splitbox').hidden = e.target.value !== 'both';
});

// ===== AÇÕES (toques nos botões) =====
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'sclose'){ if (e.target === b || b.classList.contains('x') || v === 'close') closeSheet(); return; }
  if (a === 'authtab'){ S.authTab = v; renderAuth(); }
  else if (a === 'mode'){ S.mode = v; const dn=$('#dn')?.value, hn=$('#hn')?.value; renderOnboarding(); $('#dn').value=dn||''; $('#hn').value=hn||''; }
  else if (a === 'tab'){ S.tab = v; renderShell(); }
  else if (a === 'view'){ S.view = v; renderShell(); }
  else if (a === 'prev' || a === 'next'){
    S.month = new Date(S.month.getFullYear(), S.month.getMonth() + (a==='next'?1:-1), 1);
    await loadMonth(); renderShell();
  }
  else if (a === 'fab') openSheet(null);
  else if (a === 'hide'){ S.hide = !S.hide; store('hide', S.hide ? '1' : '0'); renderShell(); }
  else if (a === 'theme'){ setTheme(!S.dark); renderShell(); }
  else if (a === 'help') toast('Central de ajuda: em breve.');
  else if (a === 'pw'){ const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; }
  else if (a === 'signup'){ S.authTab = 'up'; $('form[data-form=auth]').requestSubmit(); }
  else if (a === 'edit') openSheet(v);
  else if (a === 'skind'){ readForm(); switchKind(v); }
  else if (a === 'sdel') delTx();
  else if (a === 'logout'){ sessionStorage.removeItem('convite'); await sb.auth.signOut(); }
  else if (a === 'retry') route();
  else if (a === 'forgot'){
    const email = $('#email').value.trim();
    if (!email) return setMsg('Digite seu e-mail primeiro.');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    setMsg(error ? ptErr(error.message) : 'Enviamos um link para redefinir a senha no seu e-mail.', !error);
  }
  else if (a === 'invite'){
    b.disabled = true;
    const { data, error } = await sb.rpc('create_invite', { p_household:S.house.id, p_email:null });
    b.disabled = false;
    if (error) return toast(error.message);
    const link = location.origin + location.pathname + '?convite=' + data;
    $('#invite-out').innerHTML = `<label for="lk">Link do convite</label><input class="in" id="lk" readonly value="${esc(link)}">
      <button class="btn ghost" data-act="copy">Copiar link</button>`;
  }
  else if (a === 'copy'){
    const v2 = $('#lk').value;
    try { await navigator.clipboard.writeText(v2); toast('Link copiado!'); } catch { $('#lk').select(); toast('Selecione e copie o link.'); }
  }
});

// ===== FORMULÁRIOS =====
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.dataset.form, btn = e.target.querySelector('button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    if (f === 'auth'){
      const email = $('#email').value.trim(), password = $('#pw').value;
      const up = S.authTab === 'up';
      const { data, error } = up ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
      if (error) setMsg(ptErr(error.message));
      else if (up && !data.session) setMsg('Conta criada! Confirme pelo e-mail que enviamos e depois toque em Entrar.', true);
    }
    else if (f === 'recovery'){
      const { error } = await sb.auth.updateUser({ password: $('#pw').value });
      if (error) setMsg(ptErr(error.message)); else { toast('Senha alterada!'); route(); }
    }
    else if (f === 'house'){
      const { error } = await sb.rpc('create_household', { p_name:$('#hn').value, p_mode:S.mode, p_display_name:$('#dn').value });
      if (error) setMsg(error.message); else route();
    }
    else if (f === 'tx') await saveTx();
    else if (f === 'invite'){
      const { error } = await sb.rpc('accept_invite', { p_token:$('#tk').value.trim(), p_display_name:$('#dn2').value });
      if (error) setMsg(error.message); else { sessionStorage.removeItem('convite'); history.replaceState(null,'',location.pathname); route(); }
    }
  } finally { S.authTab = 'in'; if (btn) btn.disabled = false; }
});
</script>
</body>
</html>
